name: Bug report
description: 报告可复现的问题
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: 应用版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请勿粘贴账号、Cookie、Token、授权 URL 或教材文件。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
