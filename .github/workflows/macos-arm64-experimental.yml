name: macOS arm64 experimental build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned macOS arm64 packages
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run dist:mac:arm64
      - name: Generate SHA-256 checksums
        run: shasum -a 256 release/*macOS-arm64.dmg release/*macOS-arm64.zip > release/SHA256SUMS-macOS-arm64.txt
      - name: Upload experimental DMG
        uses: actions/upload-artifact@v4
        with:
          name: SmartEdu-Textbook-Library-0.1.3-alpha.1-macOS-arm64-unsigned-DMG
          path: release/*macOS-arm64.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Upload experimental ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SmartEdu-Textbook-Library-0.1.3-alpha.1-macOS-arm64-unsigned-ZIP
          path: release/*macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload SHA-256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: SmartEdu-Textbook-Library-0.1.3-alpha.1-macOS-arm64-SHA256
          path: release/SHA256SUMS-macOS-arm64.txt
          if-no-files-found: error
          retention-days: 14
