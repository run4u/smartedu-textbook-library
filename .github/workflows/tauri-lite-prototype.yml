name: Tauri Lite prototype

on:
  workflow_dispatch:
  push:
    branches:
      - tauri-prototype

permissions:
  contents: read

jobs:
  build-windows:
    name: Check and build Windows lite prototype
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: npm run lite:check
      - run: npm run lite:build
      - name: Upload Windows lite prototype
        uses: actions/upload-artifact@v4
        with:
          name: SmartEdu-Textbook-Library-Lite-0.1.3-alpha.1-prototype-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
