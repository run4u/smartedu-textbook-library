name: Tauri Lite prototype

on:
  workflow_dispatch:
  push:
    branches:
      - tauri-prototype

permissions:
  contents: read

jobs:
  build-windows:
    name: Check and build Windows lite prototype
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VITE_LITE_BUILD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Check Rust backend
        shell: pwsh
        run: |
          npm run lite:check -- --locked --quiet 2>&1 | Tee-Object -FilePath cargo-check.log
          if ($LASTEXITCODE -ne 0) {
            $details = ((Get-Content cargo-check.log | Select-Object -Last 160) -join "`n") -replace '%', '%25' -replace "`r?`n", '%0A'
            Write-Output "::error title=Rust compiler output::$details"
            exit $LASTEXITCODE
          }
      - name: Upload Rust check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-lite-cargo-check-log
          path: cargo-check.log
          if-no-files-found: ignore
          retention-days: 90
      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - run: npm run lite:build
      - name: Record build identity and checksums
        shell: pwsh
        run: |
          $bundleDir = 'src-tauri/target/release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $bundleDir -File -Filter '*.exe')
          if ($installers.Count -eq 0) { throw 'No Lite installer was produced' }
          $files = @($installers | ForEach-Object {
            [ordered]@{
              name = $_.Name
              sizeBytes = $_.Length
              sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          [ordered]@{
            commit = $env:GITHUB_SHA
            runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            files = $files
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath "$bundleDir/build-info.json" -Encoding utf8
          $files | ForEach-Object { "$($_.sha256)  $($_.name)" } | Set-Content -LiteralPath "$bundleDir/SHA256SUMS.txt" -Encoding utf8
      - name: Upload Windows lite prototype
        uses: actions/upload-artifact@v4
        with:
          name: SmartEdu-Textbook-Library-Lite-Windows-x64-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/build-info.json
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
