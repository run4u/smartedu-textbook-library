[package]
name = "smartedu-library-lite"
version = "0.1.3-alpha.1"
description = "A lightweight SmartEdu textbook library desktop client."
authors = ["run4u"]
license = "Apache-2.0"
repository = "https://github.com/run4u/smartedu-textbook-library"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "smartedu_library_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time"] }
